<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061633">
<title>Spin the Wheel – Interactive Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2a5e;--deep:#061633;--blue:#1456b8;--green:#22a06b;--green2:#1b8a5a;--leaf:#e8f6ef;--gold:#f5b82e;--gold2:#ffd76a;--ink:#101d38;--mut:#5b6980;--line:#e3e9f3;--bg:#f4f7fc;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Inter,"Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam",system-ui,sans-serif;color:var(--ink);background:#050d20;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 600px at 12% 8%,rgba(34,160,107,.28),transparent 60%),radial-gradient(1000px 700px at 92% 92%,rgba(20,86,184,.38),transparent 60%),linear-gradient(160deg,#07122b,#0b1f4a 55%,#071a38)}
h1,h2,.h1,.h2,.gt,.spinBtn,.mcard h2,.brand{font-family:Sora,Inter,"Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam",sans-serif}

/* ===== Premium device frame ===== */
.stage{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:12px}
.device{position:relative;width:394px;height:min(842px,calc(100dvh - 66px));padding:12px;border:3px solid transparent;border-radius:62px;background:linear-gradient(#04060b,#04060b) padding-box,linear-gradient(145deg,#aab3c7,#3a4358 28%,#10151f 52%,#4a556c 78%,#c3cada) border-box;box-shadow:0 50px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08),0 0 80px rgba(34,160,107,.12)}
.hw{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#1c2230,#6a748b)}
.hw.a{left:-6px;top:118px;height:30px}.hw.b{left:-6px;top:170px;height:54px}.hw.c{left:-6px;top:238px;height:54px}.hw.d{right:-6px;top:196px;height:84px;background:linear-gradient(270deg,#1c2230,#6a748b)}
.phone{position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate;transition:background .4s}
.phone.dark{background:radial-gradient(circle at 50% 40%,#17408a 0,#0a2150 40%,#050f26 78%)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:106px;height:31px;border-radius:20px;background:#000;z-index:70}
.island::after{content:"";position:absolute;right:12px;top:10px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2b3a63,#0a0f1c)}
.homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:128px;height:5px;border-radius:3px;background:rgba(16,29,56,.45);z-index:60;pointer-events:none}
.phone.dark .homebar{background:rgba(255,255,255,.55)}
.top{flex:none;position:relative;z-index:5;background:linear-gradient(#061633,#0a2a5e)}
.phone.dark .top{background:transparent}
.status{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;color:#fff;font:600 14.5px Inter,sans-serif}
.sicons{display:flex;gap:6px;align-items:center}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 14px}
.brand{color:#fff;font-weight:800;font-size:16px;letter-spacing:.24em}
.brand small{font-family:Inter,sans-serif;font-weight:500;font-size:9.5px;letter-spacing:.16em;opacity:.65;margin-left:9px;text-transform:uppercase}
.steps{display:flex;gap:5px}
.steps i{width:20px;height:4px;border-radius:3px;background:rgba(255,255,255,.2);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--gold2),var(--gold));box-shadow:0 0 8px rgba(245,184,46,.7)}
#app{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
.caption{font-size:11.5px;color:rgba(255,255,255,.5);letter-spacing:.03em}
@media(max-width:480px){
 .stage{padding:0;gap:0}
 .device{width:100%;height:100dvh;padding:0;border:0;border-radius:0;background:none;box-shadow:none}
 .hw,.island,.status,.homebar,.caption{display:none}
 .phone{border-radius:0}
 .top{padding-top:env(safe-area-inset-top)}
 .topbar{padding-top:12px}
}

/* ===== Shared UI ===== */
.hero{line-height:0}.hero svg{width:100%;height:auto;display:block}
.sheet{position:relative;margin-top:-24px;background:var(--bg);border-radius:28px 28px 0 0;padding:24px 20px 46px;animation:rise .5s ease both}
.sheet.flat{margin-top:0;border-radius:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.screen{animation:rise .45s ease both}
.h1{font-size:27px;line-height:1.18;margin:0 0 8px;color:var(--navy);font-weight:800;letter-spacing:-.02em}
.h2{font-size:22px;line-height:1.2;margin:0 0 4px;color:var(--navy);font-weight:700;letter-spacing:-.01em}
.mut{color:var(--mut);font-size:14px;line-height:1.55;margin:0 0 6px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--green2);font-weight:700;margin-bottom:6px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:20px 0 10px}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:22px}
.lang{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:14px 14px 13px;cursor:pointer;font:inherit;transition:.18s;box-shadow:0 4px 14px rgba(10,42,94,.05)}
.lang b{display:block;font-size:19px;color:var(--navy);margin-bottom:2px}
.lang span{font-size:11px;color:var(--mut)}
.lang:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(10,42,94,.1)}
.lang.sel{border-color:var(--green);background:linear-gradient(160deg,#f1fbf6,#e2f5ec);box-shadow:0 0 0 3px rgba(34,160,107,.15)}
.lang.sel::after{content:"✓";position:absolute;right:10px;top:10px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-weight:700;font-size:16px;letter-spacing:.01em;color:#fff;cursor:pointer;background:linear-gradient(180deg,#30c086,#1b8a5a);box-shadow:0 10px 24px rgba(27,138,90,.32),inset 0 1px 0 rgba(255,255,255,.38);transition:.15s}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{background:#cdd5e2;box-shadow:none;color:#fff;cursor:not-allowed}
.btn.gold{color:#3a2704;background:linear-gradient(180deg,#ffe28a,#f5b82e 55%,#e0a010);box-shadow:0 6px 0 #a8730a,0 14px 26px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.btn.gold:active{transform:translateY(4px);box-shadow:0 2px 0 #a8730a,0 6px 14px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.7)}
.btn.ghost{background:rgba(255,255,255,.07);color:#fff;border:1.5px solid rgba(255,255,255,.28);box-shadow:none;margin-top:12px}
.btn.ghost.light{background:#fff;color:var(--navy);border-color:var(--line)}
.field{display:flex;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:16px;overflow:hidden;transition:.15s}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(20,86,184,.12)}
.field .pre{padding:0 12px 0 16px;font-weight:700;color:var(--mut);border-right:1px solid var(--line);align-self:stretch;display:flex;align-items:center}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;padding:16px 14px;font:600 17px Inter,sans-serif;letter-spacing:.05em;color:var(--ink)}
.field input:disabled{color:var(--mut)}
.field input.otp{text-align:center;letter-spacing:.5em;font-size:20px}
.stack>*+*{margin-top:12px}
.err{color:var(--danger);font-size:12.5px;min-height:18px;margin:2px 4px 0}
.ok{background:linear-gradient(160deg,#f1fbf6,#e2f5ec);border:1px solid #bfe3cc;color:#176b43;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.link{background:none;border:0;color:var(--blue);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px 2px}
.link:disabled{color:var(--mut);cursor:default}
.chk{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
.chk:has(input:checked){border-color:var(--green);background:#f4fbf7}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--green);flex:none}
.chk a{color:var(--navy);text-decoration:underline;text-decoration-color:rgba(10,42,94,.3);text-underline-offset:3px}
.demo{margin-top:22px;border:1.5px dashed #d9b25a;background:#fffaf0;border-radius:14px;padding:11px 12px;font-size:11.5px;color:#7a5a05}
.demo b{display:block;margin-bottom:7px;font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#fff;border:1px solid #e5c273;border-radius:999px;padding:5px 10px;font:inherit;font-size:11.5px;cursor:pointer;color:#5b4304}

/* ===== Quiz (single page) ===== */
.qcard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px 16px 8px;margin:14px 0;box-shadow:0 8px 24px rgba(10,42,94,.06)}
.qnum{display:inline-block;background:linear-gradient(180deg,#fff2c4,#ffe08a);color:#6a4a03;border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.q{font:700 17px/1.4 Sora,Inter,"Noto Sans Tamil","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam",sans-serif;color:var(--navy);margin-bottom:14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;font:inherit;font-size:15px;font-weight:500;color:var(--ink);cursor:pointer;transition:.15s}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid #b7c2d3;flex:none;transition:.15s}
.opt.sel{border-color:var(--blue);background:#f0f6ff;box-shadow:0 0 0 3px rgba(20,86,184,.1)}
.opt.sel .dot{border-color:var(--blue);background:radial-gradient(var(--blue) 46%,transparent 52%)}

/* ===== Modals / toast ===== */
.modal{position:absolute;inset:0;background:rgba(5,13,32,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);display:grid;place-items:center;z-index:80;animation:fade .25s both}
.modal.bottom{align-items:end}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mcard{width:calc(100% - 40px);background:#fff;border-radius:30px;padding:30px 22px 24px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5);animation:popin .55s cubic-bezier(.2,1.35,.4,1) both}
@keyframes popin{from{opacity:0;transform:scale(.7) translateY(20px)}to{opacity:1;transform:none}}
.mcard h2{margin:12px 0 6px;font-size:26px;color:var(--navy);font-weight:800}
.mcard p{color:var(--mut);font-size:14px;margin:0 0 20px;line-height:1.5}
.tick{width:84px;height:84px;filter:drop-shadow(0 10px 18px rgba(34,160,107,.4))}
.tick path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sheetm{background:#fff;border-radius:26px 26px 0 0;padding:22px 20px 30px;width:100%;max-height:80%;overflow:auto;animation:rise .35s both}
.sms{position:absolute;left:12px;right:12px;top:58px;z-index:100;background:rgba(255,255,255,.96);color:var(--ink);border-radius:20px;padding:12px 14px;font-size:13px;line-height:1.45;box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(-24px) scale(.96);transition:.32s}
.sms.show{opacity:1;visibility:visible;transform:none}
.sms small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.08em;margin-bottom:3px;font-weight:600}
@media(max-width:480px){.sms{top:calc(env(safe-area-inset-top) + 10px)}}
.cf{position:absolute;top:-24px;z-index:95;border-radius:2px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(960px) rotate(720deg)}}

/* ===== Arena (spin + result) ===== */
.arena{position:relative;min-height:100%;padding:6px 18px 46px;text-align:center;color:#fff;overflow:hidden}
.arena>*:not(.rays){position:relative;z-index:1}
.rays{position:absolute;left:50%;top:300px;width:980px;height:980px;margin:-490px 0 0 -490px;background:repeating-conic-gradient(from 0deg,rgba(255,214,102,.14) 0 7deg,transparent 7deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:rot 70s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
.chipG{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:600;backdrop-filter:blur(6px)}
.gt{margin:12px 0 2px;font-size:31px;font-weight:800;letter-spacing:.01em;background:linear-gradient(180deg,#fff6cf,#f5b82e 62%,#d9960f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px rgba(245,184,46,.35))}
.scheme{font-size:12px;color:rgba(255,255,255,.62);margin-bottom:10px}
.coins{display:flex;justify-content:center;gap:8px;margin:4px 0 6px}
.coin{width:25px;height:25px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cf,#f5b82e 55%,#a8730a);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 3px 7px rgba(0,0,0,.45);transition:.4s}
.coin.used{filter:grayscale(1) brightness(.45);opacity:.55}
.cnt{font-size:13px;color:rgba(255,255,255,.75)}
.cnt b{font:800 18px Sora,Inter,sans-serif;color:var(--gold2);margin-right:4px}
.mute{position:absolute!important;right:14px;top:4px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;font-size:15px;cursor:pointer;z-index:5}

.wheelStage{--W:min(312px,80vw);width:var(--W);margin:30px auto 40px;perspective:1100px;position:relative}
.tilt{transform:rotateX(18deg);transform-style:preserve-3d}
.rim{position:relative;width:var(--W);height:var(--W);padding:15px;border-radius:50%;background:conic-gradient(from 20deg,#fff0b3,#d9a21b,#fff6cf,#b57d0c,#fff0b3,#d9a21b,#fff6cf,#b57d0c,#fff0b3);box-shadow:0 2px 0 #b8860b,0 4px 0 #a97b0a,0 6px 0 #9a6f09,0 8px 0 #8b6308,0 10px 0 #7c5707,0 12px 0 #6d4c06,0 30px 44px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.55),inset 0 -5px 10px rgba(0,0,0,.35)}
.face{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0a1a3d}
.face::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 30% 16%,rgba(255,255,255,.4),rgba(255,255,255,0) 46%)}
.face::after{content:"";position:absolute;inset:0;border-radius:50%;z-index:2;pointer-events:none;box-shadow:inset 0 0 24px 5px rgba(0,0,0,.55)}
.face canvas{display:block;width:100%;height:100%;transition:transform 5.6s cubic-bezier(.1,.62,.12,1);will-change:transform}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:3}
.bulbs i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe28a 50%,#e0a100);box-shadow:0 0 8px 2px rgba(255,226,138,.85);transform:rotate(var(--a)) translateY(calc(var(--W) / -2 + 7.5px));animation:blink 1.1s ease-in-out infinite}
.wheelStage.spinning .bulbs i{animation-duration:.28s}
@keyframes blink{0%,100%{opacity:.35;filter:brightness(.8)}50%{opacity:1;filter:brightness(1.35)}}
.hub{position:absolute;left:50%;top:50%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6cf,#f5b82e 50%,#a8730a);box-shadow:0 0 0 4px #7c5707,0 8px 16px rgba(0,0,0,.55),inset 0 -5px 9px rgba(0,0,0,.28);display:grid;place-items:center;font:800 11px Sora,sans-serif;letter-spacing:.12em;color:#3a2704;z-index:5}
.pointer{position:absolute;left:50%;top:-26px;width:42px;transform:translateX(-50%);transform-origin:50% 28%;filter:drop-shadow(0 7px 5px rgba(0,0,0,.55));z-index:6}
.pointer.flick{animation:flick .14s ease-out}
@keyframes flick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-17deg)}100%{transform:translateX(-50%) rotate(0)}}
.floor{position:absolute;left:6%;right:6%;bottom:-34px;height:38px;background:radial-gradient(ellipse at center,rgba(0,0,0,.65),transparent 70%);filter:blur(7px)}
.spinBtn{display:block;width:80%;margin:0 auto;border:0;border-radius:999px;padding:17px;font-weight:800;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#3a2704;cursor:pointer;background:linear-gradient(180deg,#ffe28a,#f5b82e 55%,#d9960f);box-shadow:0 6px 0 #a8730a,0 18px 32px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.75);animation:pulse 1.9s ease-in-out infinite}
.spinBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #a8730a,0 8px 16px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.75)}
.spinBtn:disabled{filter:grayscale(.9) brightness(.65);animation:none;cursor:not-allowed}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #a8730a,0 18px 32px rgba(0,0,0,.5),0 0 0 0 rgba(245,184,46,.5),inset 0 2px 0 rgba(255,255,255,.75)}50%{box-shadow:0 6px 0 #a8730a,0 18px 32px rgba(0,0,0,.5),0 0 0 14px rgba(245,184,46,0),inset 0 2px 0 rgba(255,255,255,.75)}}

.rcard{position:relative;border-radius:30px;padding:26px 18px 20px;margin:12px 0 18px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,214,102,.55);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 50px rgba(245,184,46,.25);backdrop-filter:blur(8px)}
.rcard.none{border-color:rgba(255,255,255,.2);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.rcard .em{font-size:76px;line-height:1.1;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.05)}}
.rcard .tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);font-weight:700;margin-top:6px}
.rcard h2{margin:6px 0 2px;font-size:22px;font-weight:800}
.rcard .val{font:800 34px Sora,sans-serif;background:linear-gradient(180deg,#fff6cf,#f5b82e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rcard small{display:block;margin-top:8px;color:rgba(255,255,255,.55);font-size:11.5px}
.noteD{background:rgba(59,123,224,.18);border:1px solid rgba(120,170,255,.35);border-radius:14px;padding:11px 13px;font-size:13px;margin-bottom:14px;color:#dbe8ff;text-align:left}
.done{background:rgba(34,160,107,.2);border:1px solid rgba(80,210,150,.4);border-radius:14px;padding:12px;font-weight:700;margin-bottom:14px;color:#c9f5df}
.glist{text-align:left;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;overflow:hidden;margin:8px 0 16px}
.glist div{display:flex;justify-content:space-between;gap:8px;padding:11px 14px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.09)}
.glist div:last-child{border-bottom:0}
.glist .hd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700}
.sec{text-align:left;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin:18px 0 6px}

.block{text-align:center;padding:60px 24px}
.block .em{font-size:60px}

/* ===== Presenter panel ===== */
#pbtn{position:fixed;right:16px;bottom:16px;z-index:200;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);border-radius:999px;padding:11px 16px;font:600 13px Inter,sans-serif;cursor:pointer}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(390px,100vw);background:#fff;z-index:300;box-shadow:-10px 0 40px rgba(0,0,0,.35);transform:translateX(105%);transition:.3s;display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#panel.open{transform:none}
#panel .ph{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--navy);color:#fff}
#panel .ph button{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
#panel .pbody{overflow:auto;padding:14px 16px 30px;font-size:13px}
#panel h4{margin:18px 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
#panel h4:first-child{margin-top:0}
#panel select{width:100%;padding:9px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin-bottom:8px}
#panel .pb{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;font:inherit;font-size:12.5px;cursor:pointer;margin:0 6px 6px 0}
#panel .pb.red{color:var(--danger);border-color:#f0c4be}
#panel table{width:100%;border-collapse:collapse;font-size:12px}
#panel td,#panel th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
#panel th{color:var(--mut);font-weight:600}
#panel td.n,#panel th.n{text-align:right}
#panel .lg{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#33415c;line-height:1.6}
#panel .tag{display:inline-block;background:#fdecea;color:#a5291d;border-radius:6px;padding:1px 6px;font-size:10.5px;font-weight:600}

  if(S.processed[reqId]){log('Duplicate request '+reqId.slice(-5)+' → existing result returned, no extra spin deducted');return S.processed[reqId];}
  if(S.settings.closed)return{error:'closed'};
  const r=S.retailers[mobile];
  if(!r||r.used>=r.allocated)return{error:'nospins'};
  const elig=Object.values(RW).filter(x=>(x.id==='bl'||S.inv[x.id]>0)&&!(x.major&&r.wonMajor));
  let pick=null;
  if(S.settings.force){
    const f=RW[S.settings.force];
    pick=elig.find(x=>x.id===f.id)||null;
    if(!pick)log('Forced "'+f.name+'" refused ('+(f.major&&r.wonMajor?'retailer already won a major reward':'out of stock')+') → normal draw');
    S.settings.force='';
  }
  if(!pick){
    const tot=elig.reduce((a,x)=>a+x.w,0);let n=Math.random()*tot;
    for(const x of elig){n-=x.w;if(n<=0){pick=x;break;}}
    pick=pick||RW.bl;
  }
  if(pick.id!=='bl')S.inv[pick.id]--;
  r.used++;if(pick.major)r.wonMajor=true;
  const gp='GP-'+Date.now().toString(36).toUpperCase()+uid().slice(0,3);
  let status='—',txn='';
  if(/^c\d/.test(pick.id)){txn='TXN'+Math.floor(1e9+Math.random()*9e9);status='Cashback pending · '+txn;}
  else if(pick.id==='amz')status='Voucher code via SMS (pending)';
  else if(pick.id!=='bl')status='Dispatch pending';
  S.ledger.push({gp,mobile,retailerId:DEMO[mobile].id,rid:pick.id,name:pick.name,value:pick.value,ts:new Date().toISOString(),status,major:!!pick.major});
  const res={gp,reward:pick.id,index:SEGS.indexOf(pick.id)};
  S.processed[reqId]=res;S.lastReq=reqId;
  log('Spin committed '+gp+' → '+pick.name+(pick.major?' (major)':'')+' | spins left: '+(r.allocated-r.used));
  save();return res;
}

function drawWheel(cv){
  const size=760,c=size/2,R=c-4,n=SEGS.length,a=2*Math.PI/n,ctx=cv.getContext('2d');
  cv.width=cv.height=size;ctx.clearRect(0,0,size,size);
  SEGS.forEach((id,i)=>{
    const rw=RW[id],st=-Math.PI/2+i*a;
    const g=ctx.createRadialGradient(c,c,R*.1,c,c,R);g.addColorStop(0,rw.col[0]);g.addColorStop(1,rw.col[1]);
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,st,st+a);ctx.closePath();ctx.fillStyle=g;ctx.fill();
    ctx.lineWidth=5;ctx.strokeStyle='rgba(255,238,180,.9)';ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(st+a/2);ctx.textBaseline='middle';
    ctx.font='46px sans-serif';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.shadowOffsetY=3;ctx.fillStyle='#000';ctx.fillText(rw.em,R*.4,3);
    ctx.textAlign='right';ctx.fillStyle=rw.col[2];
    if(rw.col[2]==='#ffffff'){ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=7;ctx.shadowOffsetY=2;}else{ctx.shadowColor='rgba(255,255,255,.55)';ctx.shadowBlur=0;ctx.shadowOffsetY=1.5;}
    ctx.font='800 '+(id==='bl'?27:id==='earpods'||id==='mobile'?32:38)+'px Inter,sans-serif';
    ctx.fillText(rw.short,R-34,3);
    ctx.restore();
  });
  const hg=ctx.createRadialGradient(c,c,0,c,c,R*.3);hg.addColorStop(0,'rgba(0,0,0,.35)');hg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.beginPath();ctx.arc(c,c,R*.3,0,7);ctx.fillStyle=hg;ctx.fill();
}

function trackTicks(cv,pointer,stop){
  const seg=360/SEGS.length;let prev=null,cum=0,lastK=0;
  const loop=()=>{
    if(stop.done)return;
    const st=getComputedStyle(cv).transform;
    const mm=st&&st!=='none'?st.match(/matrix\(([^)]+)\)/):null;
    if(mm){const v=mm[1].split(',').map(Number);const ang=Math.atan2(v[1],v[0])*180/Math.PI;
      if(prev!==null){let dd=ang-prev;if(dd>180)dd-=360;if(dd<-180)dd+=360;cum+=dd;}
      prev=ang;const k=Math.floor(cum/seg);
      if(k!==lastK){lastK=k;tick();pointer.classList.remove('flick');void pointer.offsetWidth;pointer.classList.add('flick');}}
    requestAnimationFrame(loop);
  };
  loop();
}

async function doSpin(){
  if(spinning){log('Repeated click ignored (spin already in progress)');return;}
  spinning=true;ac();
  const btn=$('#spin');btn.disabled=true;
  const m=S.session.mobile,reqId='REQ-'+uid()+uid();
  let res=serverSpin(m,reqId);
  if(res.error){spinning=false;render();return;}
  S.pending=res.gp;save();
  if(S.settings.dropNext){
    S.settings.dropNext=false;save();
    toast('⚠️ Network interrupted… reconnecting');log('Network dropped after commit – client retrying with same request ID');
    await sleep(1800);
    res=serverSpin(m,reqId);
    toast('✓ Reconnected – your result was recovered');
  }
  const seg=360/SEGS.length,jitter=(Math.random()-.5)*seg*.6;
  const deg=360*7+((360-(res.index+.5)*seg)%360)+jitter;
  const cv=$('#wheel'),ws=$('#ws'),pointer=$('.pointer'),stop={done:false};
  ws.classList.add('spinning');
  requestAnimationFrame(()=>{cv.style.transform='rotate('+deg+'deg)';trackTicks(cv,pointer,stop);});
  await sleep(5800);
  stop.done=true;ws.classList.remove('spinning');
  chime(res.reward!=='bl');
  const r=S.retailers[m],rem=r.allocated-r.used;
  const remEl=$('#rem');if(remEl)remEl.textContent=rem;
  document.querySelectorAll('#coins .coin').forEach((c,i)=>c.classList.toggle('used',i>=rem));
  await sleep(750);
  spinning=false;
  go('result');
}

  app.innerHTML='<div class="arena"><div class="rays"></div>'+
   '<div class="rcard '+(won?'':'none')+'"><div class="em">'+rw.em+'</div>'+
   (won?'<div class="tag">'+t('congrats')+'</div><div class="mut" style="color:rgba(255,255,255,.7);margin-top:8px">'+t('youWon')+'</div><h2>'+rw.name+'</h2><div class="val">'+fmt(rw.value)+'</div>':'<h2 style="margin-top:12px">'+t('blnt')+'</h2><div class="mut" style="color:rgba(255,255,255,.65)">No prize this spin</div>')+
   '<small>Gameplay '+last.gp+(won?' · '+last.status:'')+'</small></div>'+
   (won&&rw.major&&rem>0?'<div class="noteD">You have won a major reward. Your remaining spins can still win other rewards.</div>':'')+
   (rem>0?'<button class="btn gold" id="again">'+t('spinAgain')+' · '+rem+' '+t('spinsLeft')+'</button>':'<div class="done">✓ '+t('allDone')+' ('+r.used+'/'+r.allocated+')</div>')+
   '<div class="sec">'+t('summary')+'</div>'+
   '<div class="glist"><div class="hd"><span>Reward</span><span>Value</span></div>'+(prizes.length?prizes.map(p=>'<div><span>'+RW[p.rid].em+' '+p.name+'</span><b>'+fmt(p.value)+'</b></div>').join(''):'<div><span style="opacity:.6">No prize yet</span><span></span></div>')+'</div>'+
   (rem>0?'':'<button class="btn ghost" id="again2">Try another demo retailer</button>')+'</div>';
  const a=$('#again');if(a)a.onclick=()=>go('spin');
  const b=$('#again2');if(b)b.onclick=()=>{S.session=freshSession();go('lang');};
  if(won){confetti();}
}

function render(){
  if(['spin','result','mcq'].includes(S.step)&&!S.retailers[S.session.mobile]){S.step='lang';}
  if(S.step==='spin'&&S.pending)S.step='result';
  document.documentElement.lang=S.lang;
  phone.classList.toggle('dark',['spin','result'].includes(S.step));
  setSteps();
  ({lang:rLang,otp:rOtp,mcq:rMcq,spin:rSpin,result:rResult,noelig:rNoElig}[S.step]||rLang)();
  if(app.children.length&&!app.querySelector('.screen')&&S.step!=='lang'){app.firstElementChild.classList.add('screen');}
  app.scrollTop=0;
  if(panel.classList.contains('open'))renderPanel();
}

/* ---------- Presenter panel ---------- */
function renderPanel(){
  const inv=Object.values(RW).filter(r=>r.id!=='bl');
  const left=inv.reduce((a,r)=>a+S.inv[r.id],0),tot=inv.reduce((a,r)=>a+r.qty,0);
  const valLeft=inv.reduce((a,r)=>a+S.inv[r.id]*r.value,0);
  const rows=inv.map(r=>'<tr><td>'+r.em+' '+r.name+'</td><td class="n">'+r.qty+'</td><td class="n">'+(r.qty-S.inv[r.id])+'</td><td class="n"><b>'+S.inv[r.id]+'</b></td></tr>').join('');
  const led=S.ledger.slice(-8).reverse().map(l=>'<tr><td>'+l.gp.slice(-6)+'</td><td>'+l.mobile.slice(-4)+'</td><td>'+l.name+(l.major?' <span class="tag">major</span>':'')+'</td></tr>').join('')||'<tr><td colspan="3" style="color:#8a96aa">No gameplays yet</td></tr>';
  $('#panel .pbody').innerHTML=
   '<h4>Demo controls</h4>'+
   '<label>Force next outcome (demo only)</label><select id="pForce"><option value="">Random (weighted)</option>'+Object.values(RW).map(r=>'<option value="'+r.id+'" '+(S.settings.force===r.id?'selected':'')+'>'+r.name+'</option>').join('')+'</select>'+
   '<label style="display:flex;gap:8px;align-items:center;margin:4px 0 10px"><input type="checkbox" id="pClosed" '+(S.settings.closed?'checked':'')+'> Simulate campaign closed</label>'+
   '<button class="pb" data-act="drop">'+(S.settings.dropNext?'✓ Network drop armed':'Simulate network drop on next spin')+'</button>'+
   '<button class="pb" data-act="dup">Replay last request (duplicate)</button>'+
   '<button class="pb" data-act="restart">Restart journey</button>'+
   '<h4>Live reward inventory · '+left+' / '+tot+' prizes · '+fmt(valLeft)+' left</h4>'+
   '<table><tr><th>Reward</th><th class="n">Start</th><th class="n">Given</th><th class="n">Left</th></tr>'+rows+'</table>'+
   '<h4>Reward ledger (latest)</h4><table><tr><th>Gameplay</th><th>Retailer</th><th>Reward</th></tr>'+led+'</table>'+
   '<button class="pb" data-act="csv" style="margin-top:8px">Export ledger CSV</button>'+
   '<h4>Backend event log</h4><div class="lg">'+(S.log.length?S.log.map(x=>x.replace(/</g,'&lt;')).join('<br>'):'—')+'</div>'+
   '<h4>Notes</h4><div style="color:#5b6980;line-height:1.5">Quiz answers are recorded and checked silently on the backend; the retailer sees no right/wrong feedback and always moves on (final incorrect-answer rule pending YARA). Wheel odds here are weighted so every prize can appear during a demo; production odds follow YARA\'s approved distribution. Outcomes are decided by the simulated backend before the wheel animates, and each retailer can win only one major reward (bike / TV / mobile).</div>'+
   '<button class="pb red" data-act="reset" style="margin-top:14px">Reset all demo data</button>';
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='close')panel.classList.remove('open');
  if(a==='drop'){S.settings.dropNext=!S.settings.dropNext;save();renderPanel();}
  if(a==='dup'){if(!S.lastReq){toast('No spin has been made yet');return;}serverSpin(S.lastReq,S.lastReq);renderPanel();}
  if(a==='restart'){S.session=freshSession();S.step='lang';S.pending=null;spinning=false;save();render();}
  if(a==='reset'){if(confirm('Reset inventory, ledger and all retailer progress?')){S=fresh();spinning=false;save();render();}}
  if(a==='csv'){
    const rows=[['gameplay_id','retailer_id','mobile','reward','value_inr','timestamp','fulfilment_status']].concat(S.ledger.map(l=>[l.gp,l.retailerId,l.mobile,l.name,l.value,l.ts,l.status]));
    const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
    const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));x.download='reward-ledger.csv';x.click();
  }
});
panel.addEventListener('change',e=>{
  if(e.target.id==='pForce'){S.settings.force=e.target.value;log('Presenter: next outcome forced to '+(e.target.value||'random'));}
  if(e.target.id==='pClosed'){S.settings.closed=e.target.checked;log('Campaign '+(e.target.checked?'closed':'reopened'));if(S.step==='spin'&&!spinning)render();}
  save();
});
$('#pbtn').onclick=()=>{panel.classList.toggle('open');renderPanel();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open');});
const tickClock=()=>{const d=new Date();$('#clock').textContent=d.getHours()%12||12;$('#clock').textContent=($('#clock').textContent)+':'+String(d.getMinutes()).padStart(2,'0');};
tickClock();setInterval(tickClock,30000);

render();
})();
</script>
</body>
</html>
